<script src="https://telegram.org/js/telegram-web-app.js"></script>

  .ln { padding: 8px 0; border-top: 1px solid rgba(127,127,127,.2); }
  .ln:first-of-type { border-top: 0; }
  .scheme { width: 100%; border-radius: 12px; display: block; background: #fff; }
  .step { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .step .st { flex: 1; font-size: 15px; white-space: pre-line; }
  .step button { width: auto; flex: 0 0 44%; }
  .good { color: var(--green); font-weight: 700; } .bad { color: var(--red); font-weight: 700; }
  .msg { white-space: pre-line; background: var(--bg2); border-radius: 14px; padding: 14px; margin: 10px 0; font-size: 16px; }
  .place { display: flex; gap: 10px; align-items: baseline; background: var(--bg2); border-radius: 12px; padding: 10px 12px;
           margin: 0 0 6px; }
  .place .a { font-weight: 800; min-width: 74px; color: var(--blue); }
  .place .d { flex: 1; font-size: 15px; word-break: break-word; }
  .place .p { font-size: 22px; cursor: pointer; }
  .down { text-align: center; padding: 30px 8px; }
  .down .ico { font-size: 54px; }
  .down h2 { margin: 8px 0; font-size: 22px; }
  .down p { color: var(--hint); margin: 0 0 18px; }
  .empty { text-align: center; color: var(--hint); padding: 26px 0; }
  .spin { text-align: center; color: var(--hint); padding: 40px 0; }
  /* 22.11.2026 (руководитель): «👥 Доступ» — роли и права */
  .emp { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 14px; padding: 10px 12px; margin: 0 0 8px; cursor: pointer; }
  .emp .av { width: 38px; height: 38px; border-radius: 19px; background: var(--btn); color: #fff; font-weight: 800; display: flex;

  .role { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 2px 7px; background: #e6efff; color: var(--blue); margin-top: 2px; }
  .role.m { background: #fff0d9; color: #a85a00; } .role.no { background: #fde8e6; color: var(--red); }
  .ex { font-size: 12px; color: var(--orange); font-weight: 700; }
  .agrp { margin: 16px 0 6px; font-weight: 800; font-size: 14px; color: var(--hint); letter-spacing: .3px; }
  .whr { background: var(--bg2); border-radius: 12px; padding: 8px 10px; margin: 0 0 6px; }

  .whr .wn .ex { margin-left: auto; }
  .lv { display: flex; gap: 4px; margin: 6px 0 0; }
  .lv span { flex: 1; text-align: center; font-size: 13px; font-weight: 700; padding: 8px 2px; border-radius: 9px; background: var(--bg); color: var(--hint); cursor: pointer; }
  .lv span.on0 { background: #fde8e6; color: var(--red); } .lv span.on1 { background: #e6efff; color: var(--blue); }
  .lv span.on2 { background: var(--green); color: #fff; }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 0; }
  .acts span { font-size: 13px; padding: 6px 8px; border-radius: 9px; border: 2px solid var(--hint); background: var(--bg); cursor: pointer; }
  .acts span.y { border-color: var(--green); color: var(--green); font-weight: 700; }
  .acts span.n { color: var(--hint); text-decoration: line-through; opacity: .7; }
  .acts span.y.x { border-color: var(--orange); color: var(--orange); }
  .rsel { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .rsel span { font-size: 14px; font-weight: 700; padding: 8px 10px; border-radius: 10px; background: var(--bg2); cursor: pointer; }
  .rsel span.on { background: var(--btn); color: var(--btn-fg); }
  .asbar { background: #fff0d9; color: #a85a00; border-radius: 12px; padding: 8px 10px; margin: 0 0 10px; font-size: 14px; font-weight: 700;
           display: flex; align-items: center; gap: 8px; }
  .asbar button { width: auto; padding: 6px 10px; font-size: 13px; }
  .note { font-size: 13px; color: var(--hint); text-align: center; margin: 8px 0; }
  /* 22.11.2026 (руководитель): главный экран — вариант 2, цветные 3D-карточки */
  .mtop { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .logo { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(145deg, #34c46a, #13843c); display: flex; align-items: center;
          justify-content: center; font-size: 26px; flex: 0 0 46px; box-shadow: 0 5px 0 #0d6a2f, 0 9px 16px rgba(19,132,60,.35); }
  .mtop .tt { font-size: 22px; font-weight: 900; line-height: 1.1; } .mtop .ts { font-size: 13px; color: var(--hint); }
  .mtop .t { flex: 1; min-width: 0; }
  .rb { width: 42px; height: 42px; border-radius: 21px; background: var(--bg2); display: flex; align-items: center; justify-content: center;
        font-size: 19px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.12); flex: 0 0 42px; transition: transform .1s; }
  .rb:active { transform: translateY(3px); box-shadow: none; }
  .fchips { display: flex; gap: 8px; margin: 0 0 4px; overflow-x: auto; padding: 2px 0 8px; }
  .fchip { padding: 9px 13px; border-radius: 20px; background: var(--bg2); font-weight: 800; font-size: 13px; white-space: nowrap; cursor: pointer;
           box-shadow: 0 3px 0 rgba(0,0,0,.1); }
  .fchip.on { background: #1b1f2a; color: #fff; box-shadow: 0 3px 0 #000; }
  .msec { margin: 16px 2px 8px; font-size: 12px; font-weight: 900; letter-spacing: 1.2px; color: var(--hint); }

          transform: perspective(600px) rotateX(4deg); box-shadow: 0 8px 0 var(--d), 0 16px 24px var(--s); transition: transform .12s, box-shadow .12s; }
  .tile:before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; border-radius: 22px 22px 0 0;

  .tile:active { transform: perspective(600px) rotateX(4deg) translateY(6px); box-shadow: 0 2px 0 var(--d), 0 6px 10px var(--s); }
  .tile .e { font-size: 34px; line-height: 1.1; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
  .tile .n { font-weight: 900; font-size: 15px; margin-top: 6px; line-height: 1.15; word-break: break-word; }

                          background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); }

  /* 22.11.2026 (руководитель): у каждого действия свой шаблон — шапка колонки и задачи в её цвете (Из произв. зелёный,

     белый жирный шрифт с тенью — читается на цвете; блик — второй фон (не мешает ужатию текста) */

<body>
<div class="top"><h1 id="title">📦 Склады</h1><span class="tag">ТЕСТ</span></div>
<p class="sub" id="sub">&nbsp;</p>
<div id="view"><div class="spin">Загрузка…</div></div>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  var view = document.getElementById('view'), sub = document.getElementById('sub'), title = document.getElementById('title');
  var stack = [];          // экраны для «Назад»
  var cur = null;          // текущий экран: функция перерисовки

  // адрес сервера приходит в ссылке кнопки меню (?api=…); принимаем только туннель Cloudflare
  var api = (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, '');
  if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(api)) api = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rich(s) { return esc(s).replace(/&lt;(\/?)b&gt;/g, '<$1b>'); }
  function n(x) { return (Number(x) || 0).toLocaleString('ru-RU'); }
  function haptic(t) { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} }
  function say(t) { if (tg && tg.showAlert) tg.showAlert(t); else alert(t); }
  function $(id) { return document.getElementById(id); }

  // ---------- навигация ----------
  function topShow(on) {   // главный экран — своя шапка (3D), остальные экраны — обычный заголовок
    document.querySelector('.top').style.display = on ? '' : 'none';
    sub.style.display = on ? '' : 'none';
  }
  function go(fn) { if (cur) stack.push(cur); cur = fn; topShow(fn !== showMenu); fn(); syncBack(); }
  function goBack() { if (!stack.length) return; cur = stack.pop(); topShow(cur !== showMenu); cur(); syncBack(); }
  function home() { stack = []; cur = showMenu; topShow(false); showMenu(); syncBack(); }
  function syncBack() {
    if (!tg || !tg.BackButton) return;
    if (stack.length) tg.BackButton.show(); else tg.BackButton.hide();
  }
  if (tg && tg.BackButton) tg.BackButton.onClick(goBack);

  // ---------- связь с сервером ----------
  function down(text) {
    view.innerHTML = '<div class="down"><div class="ico">🔌</div><h2>Сервер недоступен</h2><p>' + esc(text) +
      '</p><button class="main" id="retry">🔄 Повторить</button></div>';
    $('retry').onclick = function () { cur ? cur() : showMenu(); };
  }
  // 22.11.2026 (руководитель): новая версия страницы — открытое окно перезагружается само.
  // BUILD вписывает push_page.py при загрузке; ver.json рядом — номер последней версии. На главном экране — сразу,
  // в глубине (сканы, задача) — плашка «🔄 Обновить», без потери работы; потом само при возврате на главный.
  var BUILD = 'ffc90d40', newBuild = '';
  // force — нажали «Обновить»: всегда. Само — не больше 2 попыток на одну версию (если Telegram упрямо отдаёт старую страницу,
  // не крутимся по кругу, а показываем плашку). t= — каждый раз новая ссылка, чтобы Telegram не взял страницу из памяти.
  // руководитель 22.11: обновление тихое — без плашки; внутри склада не трогаем, на главном — сразу; новую страницу
  // заранее качаем в фоне (та же ссылка), чтобы перезагрузка была мгновенной. Плашка — только если 2 попытки не помогли.
  function updUrl(b, n) {
    var q = new URLSearchParams(location.search); q.set('v', b); q.set('t', b + (n ? '-' + n : ''));
    return location.pathname + '?' + q.toString();
  }
  var warmed = '';
  function warm(b) {
    if (warmed === b) return;
    warmed = b;
    fetch(updUrl(b, 0), { cache: 'reload' }).catch(function () {});
  }
  function reloadTo(b, force) {
    var n = 0;
    try { n = +(sessionStorage.getItem('pfl:rl:' + b) || 0); sessionStorage.setItem('pfl:rl:' + b, n + 1); } catch (e) {}
    if (!force && n >= 2) return showUpd();
    location.replace(updUrl(b, force ? Date.now() : n));
  }
  function showUpd() {
    if ($('updbar')) return;
    var d = document.createElement('div');
    d.id = 'updbar'; d.className = 'asbar';
    d.innerHTML = '🔄 Есть новая версия<span style="flex:1"></span><button>Обновить</button>';
    d.querySelector('button').onclick = function () { reloadTo(newBuild, true); };
    document.body.insertBefore(d, document.body.firstChild);
  }
  function checkBuild() {
    if (BUILD.indexOf('BUILD') >= 0 || document.hidden) return;   // локальная копия — без проверки
    fetch('ver.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.build || j.build === BUILD) return;
      newBuild = j.build;
      warm(j.build);
      if (cur === showMenu) return reloadTo(j.build);   // внутри склада — ждём возврата на главный, без плашки
    }).catch(function () {});
  }
  // руководитель 22.11: ошибки страницы у людей — на сервер (miniapp/client_errors.jsonl), Ибрахим проверяет после каждого обновления
  var errN = 0;
  function reportErr(msg) {
    if (errN++ >= 5 || !api) return;
    try { call1('/api/err', { msg: String(msg).slice(0, 500), build: BUILD, screen: (cur && cur.name) || '' }).catch(function () {}); } catch (e) {}
  }
  window.addEventListener('error', function (e) { reportErr((e.message || 'ошибка') + ' @' + String(e.filename || '').split('/').pop().split('?')[0] + ':' + e.lineno + ':' + e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    if (r && (r.down || r.text)) return;   // нет связи / ответ сервера — это не ошибка страницы
    reportErr('promise: ' + (r && (r.message || r)));
  });
  setTimeout(checkBuild, 4000);
  setInterval(checkBuild, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkBuild(); });
  // 22.11.2026: бесплатный мост после перезапуска получает НОВЫЙ адрес; сторож кладёт его в api.json рядом со страницей.
  // При обрыве берём свежий адрес оттуда и повторяем запрос — переоткрывать мини-апп не нужно.
  var apiTry = 0;
  function freshApi() {
    if (Date.now() - apiTry < 20000) return Promise.resolve(false);
    apiTry = Date.now();
    return fetch('api.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      var u = String(j.api || '').replace(/\/+$/, '');
      if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u) && u !== api) { api = u; return true; }
      return false;
    }).catch(function () { return false; });
  }
  function call(path, body, timeout) {
    var b0 = JSON.stringify(body || {});
    return call1(path, body, timeout).catch(function (e) {
      if (!e || !e.down) throw e;
      return freshApi().then(function (ok) { if (!ok) throw e; return call1(path, JSON.parse(b0), timeout); });
    });
  }
  function call1(path, body, timeout) {
    if (!api) return Promise.reject({ down: true, text: 'Нет адреса сервера. Откройте мини-апп кнопкой «📦 Склады» в личке бота склада.' });
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, timeout || 15000);
    body = body || {};
    body.initData = tg ? tg.initData : '';
    if (asName && path !== '/api/acc' && path !== '/api/acc_set') body.as = asName;
    return fetch(api + path, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body), signal: ctl.signal })
      .then(function (r) {
        clearTimeout(timer);
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.status >= 500 && !j.error) throw { down: true, text: 'Компьютер PFL выключен или туннель не работает. Попробуйте позже.' };
          if (!r.ok) throw { text: j.error || ('Ошибка ' + r.status) };
          return j;
        });
      }, function () {
        clearTimeout(timer);
        throw { down: true, text: 'Компьютер PFL выключен или нет связи с ним. Попробуйте позже — данные не потеряны.' };
      });
  }
  function fail(e) {
    if (e && e.down) return down(e.text);
    view.innerHTML = '<div class="msg bad">' + esc((e && e.text) || 'Ошибка') + '</div><button id="back2">⬅️ Назад</button>';
    $('back2').onclick = function () { stack.length ? goBack() : home(); };
  }
  // ---------- быстро: сначала сохранённое на телефоне, потом свежее с сервера ----------
  var scr = 0, mem = {};
  var asName = '';   // «👁 Как он видит»: руководитель смотрит глазами сотрудника
  var ALLACTS = ['task', 'swap', 'label'];
  var curPerm = { lv: 2, acts: ALLACTS };   // права на открытом складе (приходят с сервера)
  function ck(k) { return (asName ? 'as:' + asName + ':' : '') + k; }
  function cget(k) { k = ck(k); try { return JSON.parse(localStorage.getItem('pfl:' + k)); } catch (e) { return mem[k] || null; } }
  function cset(k, v) { k = ck(k); mem[k] = v; try { localStorage.setItem('pfl:' + k, JSON.stringify(v)); } catch (e) {} }
  function canDo(a) { return curPerm.lv === 2 && (curPerm.acts || []).indexOf(a) >= 0; }
  function load(path, body, render) {
    var my = ++scr, key = path + JSON.stringify(body || {}), c = cget(key);
    if (c) render(c, true);
    return call(path, JSON.parse(JSON.stringify(body || {}))).then(function (r) {
      cset(key, r);
      if (my === scr) render(r, false);
    }).catch(function (e) {
      if (my !== scr) return;
      if (c && e && e.down) {
        var d = document.createElement('div');
        d.className = 'msg bad';
        d.textContent = '🔌 Нет связи с компьютером PFL — показано сохранённое. Нажмите «Обновить» позже.';
        view.insertBefore(d, view.firstChild);
      } else fail(e);
    });
  }
  function prefetch(list) {   // фоном, по одному — чтобы следующий экран открылся сразу
    var i = 0;
    (function next() {
      if (i >= list.length) return;
      var p = list[i++], key = p[0] + JSON.stringify(p[1]);
      call(p[0], JSON.parse(JSON.stringify(p[1]))).then(function (r) { cset(key, r); next(); }).catch(function () {});
    })();
  }
  function scanQr(hint, cb) {
    if (!tg || !tg.showScanQrPopup || !tg.isVersionAtLeast('6.4')) { say('Сканер работает только в Telegram на телефоне.'); return; }
    tg.showScanQrPopup({ text: hint }, function (text) {
      if (!text) return false;
      tg.closeScanQrPopup();
      cb(String(text).slice(0, 200));
      return true;
    });
  }
  function freeScan() {
    scanQr('QR коробки или места · quti yoki joy QR', function (code) {
      call('/api/qr', { code: code }).then(function (r) { say(r.text); }).catch(fail);
    });

      function mark(kind, el, label) {
        scanQr(kind === 'box' ? 'QR наклейки коробки · quti QR' : 'QR таблички места (' + where + ') · joy QR', function (code) {
          call('/api/scan', { id: id, kind: kind, code: code }).then(function (r) {
            s[kind] = code;
            el.innerHTML = label + ' — <span class="' + (r.ok ? 'good' : 'bad') + '">' + esc(r.text) + '</span>';
            haptic(r.ok ? 'success' : 'error');
          }).catch(fail);
        });
      }
      $('bbox').onclick = function () { mark('box', $('sbox'), '1. Коробка'); };
      $('bplace').onclick = function () { mark('place', $('splace'), '2. Место'); };
      if ($('lbl')) $('lbl').onclick = function () { askLabels(function (which) { return call('/api/label', { id: id, which: which }, 60000); }); };
      $('go').onclick = function () {
        var b = this; b.disabled = true; b.textContent = '⏳ Отправляю…';
        call('/api/move', { id: id, box: s.box, place: s.place }).then(function (r) {
          $('res').innerHTML = '<div class="msg">' + rich(r.text) + '</div>';
          b.disabled = false; b.textContent = verb;
          haptic(r.ok ? 'success' : 'warning');
          $('res').scrollIntoView({ behavior: 'smooth' });
        }).catch(function (e) { b.disabled = false; b.textContent = verb; fail(e); });
      };
    });
  }

  if (tg) { tg.ready(); tg.expand(); }
  if (!tg || !tg.initData) {
    view.innerHTML = '<div class="down"><div class="ico">📱</div><h2>Откройте в Telegram</h2><p>Кнопка «📦 Склады» в личке бота склада.</p></div>';
  } else home();
})();
</script>
</body>
</html>
