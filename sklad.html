<style>

         background: var(--bg); color: var(--fg); font-size: 17px; line-height: 1.35; -webkit-text-size-adjust: 100%; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

  .ln { padding: 8px 0; border-top: 1px solid rgba(127,127,127,.2); }
  .ln:first-of-type { border-top: 0; }

  .step { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .step .st { flex: 1; font-size: 15px; white-space: pre-line; }

  .good { color: var(--green); font-weight: 700; } .bad { color: var(--red); font-weight: 700; }
  .msg { white-space: pre-line; background: var(--bg2); border-radius: 14px; padding: 14px; margin: 10px 0; font-size: 16px; }
  .place { display: flex; gap: 10px; align-items: baseline; background: var(--bg2); border-radius: 12px; padding: 10px 12px;
           margin: 0 0 6px; }
  .place .a { font-weight: 800; min-width: 74px; color: var(--blue); }
  .place .d { flex: 1; font-size: 15px; word-break: break-word; }
  .place .p { font-size: 22px; cursor: pointer; }
  .down { text-align: center; padding: 30px 8px; }
  .down .ico { font-size: 54px; }
  .down h2 { margin: 8px 0; font-size: 22px; }
  .down p { color: var(--hint); margin: 0 0 18px; }
  .empty { text-align: center; color: var(--hint); padding: 26px 0; }
  .spin { text-align: center; color: var(--hint); padding: 40px 0; }
  /* 22.11.2026 (руководитель): «👥 Доступ» — роли и права */
  .emp { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 14px; padding: 10px 12px; margin: 0 0 8px; cursor: pointer; }
  .emp .av { width: 38px; height: 38px; border-radius: 19px; background: var(--btn); color: #fff; font-weight: 800; display: flex;
             align-items: center; justify-content: center; font-size: 17px; flex: 0 0 38px; }
  .emp .t { flex: 1; min-width: 0; } .emp .n { font-weight: 700; } .emp .c { font-size: 13px; color: var(--hint); }
  .role { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 2px 7px; background: #e6efff; color: var(--blue); margin-top: 2px; }
  .role.m { background: #fff0d9; color: #a85a00; } .role.no { background: #fde8e6; color: var(--red); }
  .ex { font-size: 12px; color: var(--orange); font-weight: 700; }
  .agrp { margin: 16px 0 6px; font-weight: 800; font-size: 14px; color: var(--hint); letter-spacing: .3px; }
  .whr { background: var(--bg2); border-radius: 12px; padding: 8px 10px; margin: 0 0 6px; }
  .whr .wn { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .whr .wn .ex { margin-left: auto; }
  .lv { display: flex; gap: 4px; margin: 6px 0 0; }

  .lv span.on0 { background: #fde8e6; color: var(--red); } .lv span.on1 { background: #e6efff; color: var(--blue); }
  .lv span.on2 { background: var(--green); color: #fff; }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 0; }
  .acts span { font-size: 13px; padding: 6px 8px; border-radius: 9px; border: 2px solid var(--hint); background: var(--bg); cursor: pointer; }
  .acts span.y { border-color: var(--green); color: var(--green); font-weight: 700; }
  .acts span.n { color: var(--hint); text-decoration: line-through; opacity: .7; }
  .acts span.y.x { border-color: var(--orange); color: var(--orange); }
  .rsel { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .rsel span { font-size: 14px; font-weight: 700; padding: 8px 10px; border-radius: 10px; background: var(--bg2); cursor: pointer; }
  .rsel span.on { background: var(--btn); color: var(--btn-fg); }
  .asbar { background: #fff0d9; color: #a85a00; border-radius: 12px; padding: 8px 10px; margin: 0 0 10px; font-size: 14px; font-weight: 700;
           display: flex; align-items: center; gap: 8px; }
  .asbar button { width: auto; padding: 6px 10px; font-size: 13px; }
  .note { font-size: 13px; color: var(--hint); text-align: center; margin: 8px 0; }
  /* 22.11.2026 (руководитель): главный экран — вариант 2, цветные 3D-карточки */
  .mtop { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .logo { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(145deg, #34c46a, #13843c); display: flex; align-items: center;
          justify-content: center; font-size: 26px; flex: 0 0 46px; box-shadow: 0 5px 0 #0d6a2f, 0 9px 16px rgba(19,132,60,.35); }
  .mtop .tt { font-size: 22px; font-weight: 900; line-height: 1.1; } .mtop .ts { font-size: 13px; color: var(--hint); }
  .mtop .t { flex: 1; min-width: 0; }
  .rb { width: 42px; height: 42px; border-radius: 21px; background: var(--bg2); display: flex; align-items: center; justify-content: center;
        font-size: 19px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.12); flex: 0 0 42px; transition: transform .1s; }
  .rb:active { transform: translateY(3px); box-shadow: none; }
  .fchips { display: flex; gap: 8px; margin: 0 0 4px; overflow-x: auto; padding: 2px 0 8px; }
  .fchip { padding: 9px 13px; border-radius: 20px; background: var(--bg2); font-weight: 800; font-size: 13px; white-space: nowrap; cursor: pointer;
           box-shadow: 0 3px 0 rgba(0,0,0,.1); }
  .fchip.on { background: #1b1f2a; color: #fff; box-shadow: 0 3px 0 #000; }
  .msec { margin: 16px 2px 8px; font-size: 12px; font-weight: 900; letter-spacing: 1.2px; color: var(--hint); }

  .tile { position: relative; border-radius: 22px; padding: 14px 12px 12px; color: #fff; min-height: 128px; overflow: hidden; cursor: pointer;
          transform: perspective(600px) rotateX(4deg); box-shadow: 0 8px 0 var(--d), 0 16px 24px var(--s); transition: transform .12s, box-shadow .12s; }
  .tile:before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; border-radius: 22px 22px 0 0;
                 background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0)); pointer-events: none; }
  .tile:active { transform: perspective(600px) rotateX(4deg) translateY(6px); box-shadow: 0 2px 0 var(--d), 0 6px 10px var(--s); }
  .tile .e { font-size: 34px; line-height: 1.1; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
  .tile .n { font-weight: 900; font-size: 15px; margin-top: 6px; line-height: 1.15; word-break: break-word; }
  .tile .c { font-size: 12px; opacity: .92; margin-top: 3px; }
  .tile .bd { position: absolute; right: 10px; top: 10px; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 16px; background: #fff; color: var(--d);

  .brs .bp { color: #0f6b33; } .brs .bm { color: #a3245c; } .brs .gx { color: #6a2b91; }
  .brs .br0 { background: rgba(255,255,255,.3); color: #fff; }
  /* 📋 Инвентаризация */
  .fchip.inv { background: linear-gradient(150deg, #7fd3ff, #2f8fd6); color: #fff; box-shadow: 0 3px 0 #1d6aa6; }
  .fchip.ost { background: linear-gradient(150deg, #ffcf6b, #e89a12); color: #fff; box-shadow: 0 3px 0 #b87508; }

  .fchips { padding-top: 4px; }
  .fchip[data-f] { color: #fff; border: 0; transition: transform .12s, box-shadow .12s, filter .12s; position: relative; overflow: hidden;
                   filter: saturate(.9); opacity: .9; }
  .fchip[data-f]:before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; pointer-events: none;
                          background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); }

  /* 22.11.2026 (руководитель): задачи — цвет и значок по форме, по плитке пробегает блик (привлекает внимание) */
  /* 22.11.2026 (руководитель): у каждого действия свой шаблон — шапка колонки и задачи в её цвете (Из произв. зелёный,
     Перемещение синий, Приход оранжевый, Отгрузка фиолетовый, Возврат красный); полоска слева — форма товара;
     белый жирный шрифт с тенью — читается на цвете; блик — второй фон (не мешает ужатию текста) */
  .ac-prod { --ag: linear-gradient(150deg, #4fd68a, #17964a); --ad: #0f6f36; --ac: #17964a; }
  .ac-move, .ac-mv, .ac-out { --ag: linear-gradient(150deg, #6fb2ff, #1f62c9); --ad: #154a9a; --ac: #1f62c9; }
  .ac-in { --ag: linear-gradient(150deg, #ffbf55, #e8820c); --ad: #a85f00; --ac: #e8820c; }
  .ac-ship { --ag: linear-gradient(150deg, #b592ff, #6a3fd1); --ad: #4a2a9a; --ac: #6a3fd1; }
  .ac-ret { --ag: linear-gradient(150deg, #ff8f8f, #d43c3c); --ad: #962424; --ac: #d43c3c; }

                          text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .col[class*="ac-"] h4 span { background: #fff; color: var(--ac); font-weight: 900; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .tb.act { color: #fff; border: 0; border-left: 6px solid var(--fs, rgba(255,255,255,.55)); box-shadow: 0 3px 0 var(--ad);
            text-shadow: 0 1px 2px rgba(0,0,0,.4); font-weight: 700;
            background-image: linear-gradient(100deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.45) 50%, rgba(255,255,255,0) 60%), var(--ag);
            background-size: 260% 100%, 100% 100%; background-repeat: no-repeat; animation: shine 4.5s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { background-position: 130% 0, 0 0; } 100% { background-position: -30% 0, 0 0; } }
  .tb.act b, .tb.act span, .tb.act u, .tb.act i { color: #fff; }
  .tb.act em { font-style: normal; margin-right: 3px; }
  .tb.act.sel { box-shadow: 0 0 0 3px #1b1f2a, 0 3px 0 var(--ad); }
  /* 22.11.2026 (руководитель): выбранная задача — тёмный фон, жёлтые буквы, приподнята; остальные бледнее */
  .tb.act.sel { background: #141a2e !important; box-shadow: 0 0 0 3px #ffd84d, 0 5px 0 #000; transform: translateY(-2px); }
  .tb.act.sel, .tb.act.sel b, .tb.act.sel span, .tb.act.sel u, .tb.act.sel i { color: #ffd84d !important; }
  #cols:has(.tb.sel) .tb:not(.sel) { opacity: .45; }
  .tb.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ad); }
  .fm-syr  { --fs: #ffd23f; --fd: #a85600; --fg: linear-gradient(150deg, #ffbe55, #e07b00); }

  // 22.11.2026 (руководитель «открыл два раза — второй не открывать»): одно окно мини-аппа. Новое окно спрашивает
  // соседей (BroadcastChannel, тот же браузер/Telegram); если кто-то отвечает — экран «уже открыт»: закрыть это или открыть здесь.
  var WIN = Math.random().toString(36).slice(2), bc = null, winOff = false, winOn = false;
  try { bc = new BroadcastChannel('pfl-kochirish'); } catch (e) {}
  function winOne(start) {
    if (!bc) return start();
    var answered = false;
    bc.onmessage = function (m) {
      var d = m.data || {};
      if (d.to && d.to !== WIN) return;
      if (d.t === 'hello' && !winOff && winOn) bc.postMessage({ t: 'here', to: d.from, from: WIN });   // отвечает только уже работающее окно
      else if (d.t === 'here') answered = true;
      else if (d.t === 'take' && !winOff) {   // другое окно забрало работу — это закрыть
        winOff = true; cur = function () {}; stack = []; topShow(false);
        view.innerHTML = '<div class="down"><div class="ico">🪟</div><h2>PFL JARAYON открыт в другом окне</h2><p>Это окно можно закрыть.</p>' +
          '<button class="main" id="wx">✖ Закрыть</button></div>';
        $('wx').onclick = function () { try { tg.close(); } catch (e) {} try { window.close(); } catch (e) {} };
        setTimeout(function () { try { tg.close(); } catch (e) {} }, 1500);
      }
    };
    bc.postMessage({ t: 'hello', from: WIN });
    setTimeout(function () {
      if (!answered) { winOn = true; return start(); }
      // руководитель 22.11: второе окно не открывать — всплывающее сообщение и закрыть, «открыть здесь» не даём
      winOff = true; topShow(false);
      view.innerHTML = '<div class="down"><div class="ico">🪟</div><h2>PFL JARAYON уже открыт</h2><p>Работайте в открытом окне.</p></div>';
      var shut = function () { try { tg.close(); } catch (e) {} try { window.close(); } catch (e) {} };
      if (tg && tg.showAlert) { try { tg.showAlert('PFL JARAYON уже открыт в другом окне.\nЭто окно закроется.', shut); } catch (e) { shut(); } }
      else { alert('PFL JARAYON уже открыт в другом окне. Это окно закроется.'); shut(); }
    }, 400);
  }
  // 22.11.2026: окна Telegram (кнопка в группе и «Открыть» в списке чатов) друг друга не видят — замок на сервере:
  // окно регистрируется, шлёт пульс каждые 8 с; уже есть живое другое окно — всплывающее «уже открыт» и закрыть.
  function winShut(text) {
    winOff = true; cur = function () {}; stack = []; topShow(false);
    view.innerHTML = '<div class="down"><div class="ico">🪟</div><h2>PFL JARAYON уже открыт</h2><p>Работайте в открытом окне.</p></div>';
    var shut = function () { try { tg.close(); } catch (e) {} try { window.close(); } catch (e) {} };
    if (tg && tg.showAlert) { try { tg.showAlert((text || 'PFL JARAYON уже открыт в другом окне.') + '\nЭто окно закроется.', shut); } catch (e) { shut(); } }
    else { alert((text || 'PFL JARAYON уже открыт в другом окне.') + ' Это окно закроется.'); shut(); }
  }
  function winServer(start) {
    call('/api/win', { win: WIN, act: 'hello' }, 8000).then(function (r) {
      if (r && r.ok === false) return winShut(r.text);
      start();
      setInterval(function () {
        if (winOff || document.hidden) return;
        call1('/api/win', { win: WIN, act: 'beat' }, 8000).then(function (q) { if (q && q.ok === false) winShut(q.text); }).catch(function () {});
      }, 8000);
      window.addEventListener('pagehide', function () {   // закрыли окно — сразу освободить
        try {
          var b = { win: WIN, act: 'bye', initData: tg ? tg.initData : '' };
          if (pcKey) { b.pc = pcKey; b.dev = devId(); }
          navigator.sendBeacon(api + '/api/win', new Blob([JSON.stringify(b)], { type: 'text/plain' }));
        } catch (e) {}
      });
    }).catch(function () { start(); });   // сервер не ответил — не мешаем работать
  }
  function canFull() {   // во весь экран — Telegram 8.0+ (телефон и компьютер)
    try { return !!(tg && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')); } catch (e) { return false; }
  }
  if (canFull()) {
    try {
      document.body.classList.toggle('fs', !!tg.isFullscreen);
      tg.onEvent('fullscreenChanged', function () {
        document.body.classList.toggle('fs', !!tg.isFullscreen);   // во весь экран — кнопки и на внутренних экранах телефона
        var b = $('fsb'); if (b) b.textContent = tg.isFullscreen ? '🗗' : '⛶';
        Array.prototype.forEach.call(document.querySelectorAll('[data-fs]'), function (x) { x.textContent = tg.isFullscreen ? '🗗' : '⛶'; });
      });
      tg.onEvent('fullscreenFailed', function () { say('Этот Telegram не умеет «во весь экран» — обновите Telegram.'); });
    } catch (e) {}
  }
  function boot(fn) {   // нет адреса сервера (открыли из группы / на компьютере) — сначала api.json, потом экран
    if (api) return fn();
    view.innerHTML = '<div class="spin">Подключаюсь…</div>';
    freshApi().then(function () { fn(); });
  }
  if (pcKey) winOne(function () { boot(function () { winServer(home); }); });
  else if (!tg || !tg.initData) {
    view.innerHTML = '<div class="down"><div class="ico">📱</div><h2>Откройте в Telegram</h2><p>Кнопка «PFL JARAYON» в закрепе группы PFL JARAYON.</p>' +
      '<p>💻 На компьютере: в личке бота склада напишите <b>/pc</b>.</p></div>';
  } else if (new URLSearchParams(location.search).get('drv')) {
    // 🚛 водитель нажал «Взял / Привёз / Проблема» под сообщением бота — отмечаем и показываем итог (руководитель 22.11)
    var qd = new URLSearchParams(location.search), aid = qd.get('drv'), act = qd.get('act');
    var AW = { take: ['✅', 'Взял'], done: ['🏁', 'Привёз'], prob: ['❗', 'Проблема'] }[act] || ['❔', '?'];
    topShow(false);
    view.innerHTML = '<div class="ackw"><div class="big2">' + AW[0] + '</div><h2>Отмечаю: ' + AW[1] + '…</h2><p>Перемещение №' + esc(aid) + '</p></div>';
    call('/api/driver_ack', { id: aid, act: act }, 30000).then(function (q) {
      haptic(q.ok ? 'success' : 'error');
      view.innerHTML = '<div class="ackw"><div class="big2">' + (q.ok ? AW[0] : '⚠️') + '</div><h2>' + esc(q.text) + '</h2><p>Перемещение №' + esc(aid) + '</p>' +
        '<button class="main" id="ackx">Закрыть</button></div>';
      $('ackx').onclick = function () { try { tg.close(); } catch (e) {} };
    }).catch(fail);
  } else verGate(function () { winOne(function () { boot(function () { winServer(home); }); }); });
})();
</script>
