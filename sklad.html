  /* 22.11.2026 (руководитель): «👥 Доступ» — роли и права */

  /* 22.11.2026 (руководитель): у каждого действия свой шаблон — шапка колонки и задачи в её цвете (Из произв. зелёный,

<p class="sub" id="sub">&nbsp;</p>
<div id="view"><div class="spin">Загрузка…</div></div>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  // 22.11.2026 (руководитель «Да, делай»): 💻 компьютер — личный ключ из /pc в боте склада (?pc=…), хранится в браузере;
  // сервер проверяет его каждый раз (право «💻 Компьютер», 08:50–18:00). Вне Telegram — без Telegram-функций.
  var pcKey = '';
  (function () {
    var q = new URLSearchParams(location.search), k = q.get('pc');
    try {
      if (k) { localStorage.setItem('pfl:pc', k); q.delete('pc'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : '')); }
      if (!(tg && tg.initData)) pcKey = localStorage.getItem('pfl:pc') || '';
    } catch (e) { if (k && !(tg && tg.initData)) pcKey = k; }
  })();
  if (tg && !tg.initData) tg = null;
  var view =document.getElementById('view'), sub = document.getElementById('sub'), title = document.getElementById('title');
  var stack = [];          // экраны для «Назад»
  var cur = null;          // текущий экран: функция перерисовки

  // адрес сервера приходит в ссылке кнопки меню (?api=…); принимаем только туннель Cloudflare
  var api = (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, '');
  if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(api)) api = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rich(s) { return esc(s).replace(/&lt;(\/?)b&gt;/g, '<$1b>'); }
  function n(x) { return (Number(x) || 0).toLocaleString('ru-RU'); }
  function haptic(t) { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} }
  function say(t) { if (tg && tg.showAlert) tg.showAlert(t); else alert(t); }
  function $(id) { return document.getElementById(id); }

  // ---------- навигация ----------
  function topShow(on) {   // главный экран — своя шапка (3D), остальные экраны — обычный заголовок
    document.querySelector('.top').style.display = on ? '' : 'none';
    sub.style.display = on ? '' : 'none';
  }
  function go(fn) { if (cur) stack.push(cur); cur = fn; topShow(fn !== showMenu); fn(); syncBack(); }
  function goBack() { if (!stack.length) return; cur = stack.pop(); topShow(cur !== showMenu); cur(); syncBack(); }
  function home() { stack = []; cur = showMenu; topShow(false); showMenu(); syncBack(); }
  function syncBack() {
    if (!tg || !tg.BackButton) return;
    if (stack.length) tg.BackButton.show(); else tg.BackButton.hide();
  }
  if (tg && tg.BackButton) tg.BackButton.onClick(goBack);

  // ---------- связь с сервером ----------
  function pcOff(text) {   // 💻 ключ кончился / право снято — экран-замок, новая ссылка: /pc в боте
    cur = function () {}; stack = []; topShow(false); pcKey = '';
    try {   // ключ и сохранённые данные складов с этого компьютера — убрать
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('pfl:') === 0 && k !== 'pfl:mfilter') localStorage.removeItem(k); });
    } catch (e) {}
    mem = {};
    view.innerHTML = '<div class="down"><div class="ico">🔒</div><h2>Доступ на компьютере закончился</h2><p>' + esc(text || '') +
      '</p><p>В личке бота склада напишите <b>/pc</b> и нажмите «💻 Открыть на компьютере».</p></div>';
  }
  function down(text) {
    view.innerHTML = '<div class="down"><div class="ico">🔌</div><h2>Сервер недоступен</h2><p>' + esc(text) +

    });
  }

  if (tg) { tg.ready(); tg.expand(); }
  if (pcKey && 'serviceWorker' in navigator) {   // 💻 «Установить» как программу (значок на рабочем столе)
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
  // 22.11.2026 (руководитель «открыл два раза — второй не открывать»): одно окно мини-аппа. Новое окно спрашивает
  // соседей (BroadcastChannel, тот же браузер/Telegram); если кто-то отвечает — экран «уже открыт»: закрыть это или открыть здесь.
  var WIN = Math.random().toString(36).slice(2), bc = null, winOff = false, winOn = false;
  try { bc = new BroadcastChannel('pfl-kochirish'); } catch (e) {}
  function winOne(start) {
    if (!bc) return start();
    var answered = false;
    bc.onmessage = function (m) {
      var d = m.data || {};
      if (d.to && d.to !== WIN) return;
      if (d.t === 'hello' && !winOff && winOn) bc.postMessage({ t: 'here', to: d.from, from: WIN });   // отвечает только уже работающее окно
      else if (d.t === 'here') answered = true;
      else if (d.t === 'take' && !winOff) {   // другое окно забрало работу — это закрыть
        winOff = true; cur = function () {}; stack = []; topShow(false);
        view.innerHTML = '<div class="down"><div class="ico">🪟</div><h2>KO‘CHIRISH открыт в другом окне</h2><p>Это окно можно закрыть.</p>' +
          '<button class="main" id="wx">✖ Закрыть</button></div>';
        $('wx').onclick = function () { try { tg.close(); } catch (e) {} try { window.close(); } catch (e) {} };
        setTimeout(function () { try { tg.close(); } catch (e) {} }, 1500);
      }
    };
    bc.postMessage({ t: 'hello', from: WIN });
    setTimeout(function () {
      if (!answered) { winOn = true; return start(); }
      // руководитель 22.11: второе окно не открывать — всплывающее сообщение и закрыть, «открыть здесь» не даём
      winOff = true; topShow(false);
      view.innerHTML = '<div class="down"><div class="ico">🪟</div><h2>KO‘CHIRISH уже открыт</h2><p>Работайте в открытом окне.</p></div>';
      var shut = function () { try { tg.close(); } catch (e) {} try { window.close(); } catch (e) {} };
      if (tg && tg.showAlert) { try { tg.showAlert('KO‘CHIRISH уже открыт в другом окне.\nЭто окно закроется.', shut); } catch (e) { shut(); } }
      else { alert('KO‘CHIRISH уже открыт в другом окне. Это окно закроется.'); shut(); }
    }, 400);
  }
  // 22.11.2026: окна Telegram (кнопка в группе и «Открыть» в списке чатов) друг друга не видят — замок на сервере:
  // окно регистрируется, шлёт пульс каждые 8 с; уже есть живое другое окно — всплывающее «уже открыт» и закрыть.
  function winShut(text) {
    winOff = true; cur = function () {}; stack = []; topShow(false);
    view.innerHTML = '<div class="down"><div class="ico">🪟</div><h2>KO‘CHIRISH уже открыт</h2><p>Работайте в открытом окне.</p></div>';
    var shut = function () { try { tg.close(); } catch (e) {} try { window.close(); } catch (e) {} };
    if (tg && tg.showAlert) { try { tg.showAlert((text || 'KO‘CHIRISH уже открыт в другом окне.') + '\nЭто окно закроется.', shut); } catch (e) { shut(); } }
    else { alert((text || 'KO‘CHIRISH уже открыт в другом окне.') + ' Это окно закроется.'); shut(); }
  }
  function winServer(start) {
    call('/api/win', { win: WIN, act: 'hello' }, 8000).then(function (r) {
      if (r && r.ok === false) return winShut(r.text);
      start();
      setInterval(function () {
        if (winOff || document.hidden) return;
        call1('/api/win', { win: WIN, act: 'beat' }, 8000).then(function (q) { if (q && q.ok === false) winShut(q.text); }).catch(function () {});
      }, 8000);
      window.addEventListener('pagehide', function () {   // закрыли окно — сразу освободить
        try {
          var b = { win: WIN, act: 'bye', initData: tg ? tg.initData : '' };
          if (pcKey) { b.pc = pcKey; b.dev = devId(); }
          navigator.sendBeacon(api + '/api/win', new Blob([JSON.stringify(b)], { type: 'text/plain' }));
        } catch (e) {}
      });
    }).catch(function () { start(); });   // сервер не ответил — не мешаем работать
  }
  function canFull() {   // во весь экран — Telegram 8.0+ (телефон и компьютер)
    try { return !!(tg && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')); } catch (e) { return false; }
  }
  if (canFull()) {
    try {
      tg.onEvent('fullscreenChanged', function () { var b = $('fsb'); if (b) b.textContent = tg.isFullscreen ? '🗗' : '⛶'; });
      tg.onEvent('fullscreenFailed', function () { say('Этот Telegram не умеет «во весь экран» — обновите Telegram.'); });
    } catch (e) {}
  }
  function boot(fn) {   // нет адреса сервера (открыли из группы / на компьютере) — сначала api.json, потом экран
    if (api) return fn();
    view.innerHTML = '<div class="spin">Подключаюсь…</div>';
    freshApi().then(function () { fn(); });
  }
  if (pcKey) winOne(function () { boot(function () { winServer(home); }); });
  else if (!tg || !tg.initData) {
    view.innerHTML = '<div class="down"><div class="ico">📱</div><h2>Откройте в Telegram</h2><p>Кнопка «KO‘CHIRISH 🔄» в личке бота склада.</p>' +
      '<p>💻 На компьютере: в личке бота склада напишите <b>/pc</b>.</p></div>';
  } else if (new URLSearchParams(location.search).get('drv')) {
    // 🚛 водитель нажал «Взял / Привёз / Проблема» под сообщением бота — отмечаем и показываем итог (руководитель 22.11)
    var qd = new URLSearchParams(location.search), aid = qd.get('drv'), act = qd.get('act');
    var AW = { take: ['✅', 'Взял'], done: ['🏁', 'Привёз'], prob: ['❗', 'Проблема'] }[act] || ['❔', '?'];
    topShow(false);
    view.innerHTML = '<div class="ackw"><div class="big2">' + AW[0] + '</div><h2>Отмечаю: ' + AW[1] + '…</h2><p>Перемещение №' + esc(aid) + '</p></div>';
    call('/api/driver_ack', { id: aid, act: act }, 30000).then(function (q) {
      haptic(q.ok ? 'success' : 'error');
      view.innerHTML = '<div class="ackw"><div class="big2">' + (q.ok ? AW[0] : '⚠️') + '</div><h2>' + esc(q.text) + '</h2><p>Перемещение №' + esc(aid) + '</p>' +
        '<button class="main" id="ackx">Закрыть</button></div>';
      $('ackx').onclick = function () { try { tg.close(); } catch (e) {} };
    }).catch(fail);
  } else winOne(function () { boot(function () { winServer(home); }); });
})();
</script>
